<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOLUWORLD</title>

  <style>
    * {

    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f9;
      color: #222;
    }

    header {
      background: #0b5ed7;

      text-align: center;
      padding: 25px 15px;
    }

    header h1 {

    header p {

    }

    main {

    }

    section {

      padding: 20px;
      margin-bottom: 25px;

      padding: 12px;

      border-radius: 8px;
      font-size: 15px;
    }

    textarea {

    }

    button {
      border: none;
      border-radius: 8px;
      padding: 11px 16px;
      margin-top: 12px;
      cursor: pointer;
      font-size: 15px;
      font-weight: bold;
    }

    .publish-btn {
      background: #198754;
      color: white;
      width: 100%;
    }

    .search-btn {
      background: #0b5ed7;
      color: white;
    }

    .clear-btn {
      background: #6c757d;
      color: white;
    }

    .edit-btn {
      background: #ffc107;
      color: #222;
      margin-right: 5px;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      margin-right: 5px;
    }

    .solution-btn {
      background: #198754;
      color: white;
    }

    .problem {
      border: 1px solid #ddd;
      border-left: 6px solid #0b5ed7;
      border-radius: 10px;
      padding: 18px;
      margin-top: 15px;
      background: #fafafa;
    }

    .problem h3 {
      margin-top: 0;
      color: #0b5ed7;
    }

    .problem p {
      margin: 8px 0;
      line-height: 1.5;
    }

    .urgency {
      font-weight: bold;
    }

    .solution {
      margin-top: 15px;
      padding: 15px;
      background: #eef8f0;
      border-radius: 8px;
      border-left: 5px solid #198754;
    }

    .solution h4 {
      margin-top: 0;
      color: #198754;
    }

    .message {
      padding: 12px;
      border-radius: 8px;
      margin-top: 10px;
      display: none;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .info {
      background: #cff4fc;
      color: #055160;
    }

    .search-zone {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    .buttons-search {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .search-zone {
        grid-template-columns: 1fr;
      }

      header h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

<main>

  <!-- =========================
       PROBLÈMES PUBLIÉS
  ========================= -->

  <section>

    <h2>📋 Problèmes publiés</h2>

    <div class="search-zone">

      <div>

        <label for="filter-category">
          Filtrer par catégorie
        </label>

        <select id="filter-category">

          <option value="">
            Toutes les catégories
          </option>

          <option value="Eau">
            💧 Eau
          </option>

          <option value="Électricité">
            ⚡ Électricité
          </option>

          <option value="Route">
            🛣️ Route
          </option>

          <option value="Déchets">
            🗑️ Déchets
          </option>

          <option value="Santé">
            🏥 Santé
          </option>

          <option value="Éducation">
            📚 Éducation
          </option>

          <option value="Sécurité">
            🛡️ Sécurité
          </option>

          <option value="Autre">
            📌 Autre
          </option>

          <option value="Transport">
            🚕 Transport 
          </option>

        </select>

      </div>

      </p>

  <!-- =========================
       TROUVER UNE SOLUTION
  ========================= -->

  <section id="solution">

    <h2>💡 Trouver une solution</h2>

    <p>
      Sélectionnez un problème ci-dessus pour rechercher
      une solution.
    </p>

    <div id="solution-content">

      <p>
        Aucune solution sélectionnée.
      </p>

    </div>

</main>


<script>

/* ==================================================
   CONFIGURATION SUPABASE
================================================== */

const SUPABASE_URL =
  "https://cempljialofhnkvjpsko.supabase.co";

/*
   IMPORTANT :

   Remplace uniquement la valeur ci-dessous
   par TON ancienne clé Supabase.

   Exemple :

   const SUPABASE_KEY = "sb_publishable_....";
*/

const SUPABASE_KEY =
  sb_publishable_TYTq252UBISGbU9qIFWSrA_YR5Jh-4f


/* ==================================================
   OUTILS
================================================== */

function normaliser(texte) {

  if (texte === null || texte === undefined) {
    return "";
  }

  return String(texte)
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();
}


/* ==================================================
   AFFICHER UN MESSAGE
================================================== */

function afficherMessage(
  elementId,
  message,
  type
) {

  const element =
    document.getElementById(elementId);

  if (!element) {
    return;
  }

  element.textContent = message;

  element.className =
    "message " + type;

  element.style.display = "block";
}


/* ==================================================
   CACHER UN MESSAGE
================================================== */

function cacherMessage(elementId) {

  const element =
    document.getElementById(elementId);

  if (!element) {
    return;
  }

  element.style.display = "none";
}


/* ==================================================
   PUBLIER UN PROBLÈME
================================================== */

document
  .getElementById("problem-form")
  .addEventListener(
    "submit",
    async function(e) {

      e.preventDefault();

      cacherMessage("form-message");

      const data = {

        created_at:
          new Date().toISOString(),

        Name:
          document
            .getElementById("nom")
            .value
            .trim(),

        City:
          document
            .getElementById("ville")
            .value
            .trim(),

        "Catégory":
          document
            .getElementById("catégorie")
            .value,

        description:
          document
            .getElementById("problème")
            .value
            .trim(),

        urgency:
          document
            .getElementById("urgence")
            .value

      };


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/Problems",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Prefer":
                  "return=representation"

              },

              body:
                JSON.stringify(data)

            }
          );


        if (!response.ok) {

          const error =
            await response.text();

          throw new Error(error);
        }


        afficherMessage(
          "form-message",
          "Votre problème a été publié avec succès !",
          "success"
        );


        document
          .getElementById("problem-form")
          .reset();


        await afficherProblemes();

      }


      catch(error) {

        console.error(error);

        afficherMessage(
          "form-message",
          "Erreur lors de la publication : " +
          error.message,
          "error"
        );

      }

    }
  );


/* ==================================================
   AFFICHER TOUS LES PROBLÈMES
================================================== */

async function afficherProblemes() {

  const liste =
    document.getElementById(
      "problems-list"
    );


  if (!liste) {
    return;
  }


  liste.innerHTML =
    "<p>Chargement des problèmes...</p>";


  try {

    const recherche =
      normaliser(
        document
          .getElementById(
            "search-problems"
          )
          .value
      );


    const categorieFiltre =
      normaliser(
        document
          .getElementById(
            "filter-category"
          )
          .value
      );


    /*
       RÉCUPÉRATION DES PROBLÈMES
       DEPUIS SUPABASE
    */

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/Problems?select=*&order=created_at.desc",
        {

          method: "GET",

          headers: {

            "apikey":
              SUPABASE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_KEY

          }

        }
      );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);
    }


    let problems =
      await response.json();


    console.log(
      "Nombre de problèmes reçus :",
      problems.length
    );


    /*
       FILTRAGE
    */

    problems =
      problems.filter(
        function(problem) {

          const nom =
            normaliser(
              problem.Name
            );


          const ville =
            normaliser(
              problem.City
            );


          const categorie =
            normaliser(
              problem["Catégory"]
            );


          const texteRecherche =
            recherche === "" ||

            nom.includes(
              recherche
            ) ||

            ville.includes(
              recherche
            ) ||

            categorie.includes(
              recherche
            );


          const filtreCategorie =
            categorieFiltre === "" ||

            categorie ===
            categorieFiltre;


          return (
            texteRecherche &&
            filtreCategorie
          );

        }
      );


    /*
       NETTOYAGE DE LA LISTE
    */

    liste.innerHTML = "";


    /*
       AUCUN PROBLÈME
    */

    if (
      problems.length === 0
    ) {

      liste.innerHTML = `
        <div class="message info"
             style="display:block;">
          Aucun problème trouvé.
        </div>
      `;

      return;
    }


    /*
       AFFICHAGE DE CHAQUE PROBLÈME
    */

    problems.forEach(
      function(problem) {

        const div =
          document.createElement(
            "div"
          );


        div.className =
          "problem";


        /*
           URGENCE
        */

        let urgenceTexte =
          problem.urgency || "";


        let urgenceEmoji =
          "🟢";


        if (
          normaliser(
            problem.urgency
          ) === "moyenne"
        ) {

          urgenceEmoji = "🟠";

        }


        if (
          normaliser(
            problem.urgency
          ) === "elevee"
        ) {

          urgenceEmoji = "🔴";

        }


        /*
           DATE
        */

        let dateTexte =
          "";


        if (
          problem.created_at
        ) {

          const date =
            new Date(
              problem.created_at
            );


          if (
            !isNaN(
              date.getTime()
            )
          ) {

            dateTexte =
              date.toLocaleString(
                "fr-FR"
              );

          }

        }


        /*
           CONTENU DU PROBLÈME
        */

        div.innerHTML = `

          <h3>
            ${echapperHTML(
              problem.Name || ""
            )}
          </h3>

          <p>
            <strong>📍 Ville :</strong>
            ${echapperHTML(
              problem.City || ""
            )}
          </p>

          <p>
            <strong>📂 Catégorie :</strong>
            ${echapperHTML(
              problem["Catégory"] || ""
            )}
          </p>

          <p>
            <strong>📝 Description :</strong><br>
            ${echapperHTML(
              problem.description || ""
            )}
          </p>

          <p class="urgency">
            <strong>🚨 Urgence :</strong>
            ${urgenceEmoji}
            ${echapperHTML(
              urgenceTexte
            )}
          </p>

          <p>
            <strong>📅 Publié le :</strong>
            ${dateTexte}
          </p>

          <div>

            <button
              type="button"
              class="solution-btn"
            >
              💡 Trouver une solution
            </button>

            <button
              type="button"
              class="edit-btn"
            >
              ✏️ Modifier
            </button>

            <button
              type="button"
              class="delete-btn"
            >
              🗑️ Supprimer
            </button>

          </div>

          <div
            class="solution"
            style="display:none;"
          ></div>

        `;


        /*
           BOUTON SOLUTION
        */

        const solutionButton =
          div.querySelector(
            ".solution-btn"
          );


        const solutionBox =
          div.querySelector(
            ".solution"
          );


        solutionButton
          .addEventListener(
            "click",
            function() {

              trouverSolution(
                problem,
                solutionBox
              );

            }
          );


        /*
           BOUTON MODIFIER
        */

        const editButton =
          div.querySelector(
            ".edit-btn"
          );


        editButton
          .addEventListener(
            "click",
            function() {

              modifierProbleme(
                problem
              );

            }
          );


        /*
           BOUTON SUPPRIMER
        */

        const deleteButton =
          div.querySelector(
            ".delete-btn"
          );


        deleteButton
          .addEventListener(
            "click",
            function() {

              supprimerProbleme(
                problem.id
              );

            }
          );


        liste.appendChild(
          div
        );

      }
    );

  }


  catch(error) {

    console.error(error);

    liste.innerHTML = `

      <div
        class="message error"
        style="display:block;"
      >

        Impossible de charger les problèmes.

        <br><br>

        Erreur :
        ${echapperHTML(
          error.message
        )}

      </div>

    `;

  }

}


/* ==================================================
   PROTECTION DU HTML
================================================== */

function echapperHTML(
  texte
) {

  if (
    texte === null ||
    texte === undefined
  ) {

    return "";

  }


  return String(texte)
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==================================================
   MODIFIER UN PROBLÈME
================================================== */

async function modifierProbleme(
  problem
) {

  const nouveauNom =
    prompt(
      "Nom :",
      problem.Name || ""
    );


  if (
    nouveauNom === null
  ) {
    return;
  }


  const nouvelleVille =
    prompt(
      "Ville :",
      problem.City || ""
    );


  if (
    nouvelleVille === null
  ) {
    return;
  }


  const nouvelleCategorie =
    prompt(
      "Catégorie :",
      problem["Catégory"] || ""
    );


  if (
    nouvelleCategorie === null
  ) {
    return;
  }


  const nouvelleDescription =
    prompt(
      "Description :",
      problem.description || ""
    );


  if (
    nouvelleDescription === null
  ) {
    return;
  }


  const nouvelleUrgence =
    prompt(
      "Urgence :",
      problem.urgency || ""
    );


  if (
    nouvelleUrgence === null
  ) {
    return;
  }


  const data = {

    Name:
      nouveauNom.trim(),

    City:
      nouvelleVille.trim(),

    "Catégory":
      nouvelleCategorie.trim(),

    description:
      nouvelleDescription.trim(),

    urgency:
      nouvelleUrgence.trim()

  };


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/Problems?id=eq." +
        encodeURIComponent(
          problem.id
        ),
        {

          method: "PATCH",

          headers: {
