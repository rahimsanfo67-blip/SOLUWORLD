<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SOLUWORLD</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
      margin: 0;
      padding: 25px;
    }

    h1, h2 {
      color: #1464f4;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      margin-top: 20px;
      padding: 12px 18px;
      border: none;
      border-radius: 8px;
      background: #1464f4;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      opacity: 0.9;
    }

    .problem {
      background: white;
      border: 1px solid #ccc;
      padding: 15px;
      margin-bottom: 10px;
      border-radius: 8px;
    }

    .edit-btn,
    .delete-btn {
      margin-right: 5px;
    }

    #solution {
      padding: 15px;
      margin-top: 15px;
      border: 2px solid #1464f4;
      border-radius: 8px;
      background: #eaf2ff;
    }
  </style>
</head>

<body>

  <!-- PUBLICATION -->
  <section id="publier">
    <h2>Publier un problème</h2>

    <form id="problem-form">

      <label for="nom">Votre nom</label>
      <input
        type="text"
        id="nom"
        placeholder="Votre nom"
        required
      >

      <label for="ville">Ville</label>
      <input
        type="text"
        id="ville"
        placeholder="Ex. Ouagadougou"
        required
      >

      <label for="catégorie">Catégorie</label>
      <select id="catégorie" required>
        <option value="">Choisir une catégorie</option>
        <option value="Eau">Eau</option>
        <option value="Électricité">Électricité</option>
        <option value="Logement">Logement</option>
        <option value="Emploi">Emploi</option>
        <option value="Transport">Transport</option>
        <option value="Formation">Formation</option>
        <option value="Réparation">Réparation</option>
        <option value="Autre">Autre</option>
      </select>

      <label for="problème">Décrivez votre problème</label>
      <textarea
        id="problème"
        rows="5"
        placeholder="Expliquez votre problème..."
        required
      ></textarea>

      <label for="urgence">Urgence</label>
      <select id="urgence">
        <option value="Normal">Normal</option>
        <option value="Importance">Importance</option>
        <option value="Urgente">Urgente</option>
      </select>

      <button type="submit">
        Publier mon problème
      </button>

    </form>
  </section>


  <!-- ACCUEIL -->
  <h1>SOLUWORLD 🌍</h1>

  <p>Un problème. Une solution. Partout.</p>

  <button type="button" id="publier-btn">
    Publier un problème
  </button>

  <button id="solution-btn" type="button">
    Trouver une solution
  </button>


  <!-- PROBLÈMES -->
  <section>

    <h2>Problèmes publiés</h2>

    <select id="filter-category">

      <option value="">
        Toutes les catégories
      </option>

      <option value="Eau">
        Eau
      </option>

      <option value="Électricité">
        Électricité
      </option>

      <option value="Logement">
        Logement
      </option>

      <option value="Emploi">
        Emploi
      </option>

      <option value="Transport">
        Transport
      </option>

      <option value="Formation">
        Formation
      </option>

      <option value="Réparation">
        Réparation
      </option>

      <option value="Autre">
        Autre
      </option>

    </select>


    <input
      type="text"
      id="search-problems"
      placeholder="🔎 Rechercher un problème, une ville ou une catégorie..."
    >


    <button id="search-btn" type="button">
      🔎 Rechercher
    </button>

    <button id="clear-search" type="button">
      Effacer
    </button>


    <div id="problems-list"></div>

  </section>


<script>

const SUPABASE_URL =
  "https://cempljialofhnkvjpsko.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_TYTq252UBISGbU9qIFWSrA_YR5Jh-4f";



/* =========================
   FONCTION NORMALISER
========================= */

function normaliser(texte) {

  return String(texte || "")
    .toLowerCase()
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .trim();

}



/* =========================
   PUBLIER UN PROBLÈME
========================= */

document
  .getElementById("problem-form")
  .addEventListener("submit", async function(e) {

    e.preventDefault();

    const data = {

      created_at: new Date().toISOString(),

      Name:
        document.getElementById("nom").value.trim(),

      City:
        document.getElementById("ville").value.trim(),

      "Catégory":
        document.getElementById("catégorie").value,

      description:
        document.getElementById("problème").value.trim(),

      urgency:
        document.getElementById("urgence").value

    };


    try {

      const response = await fetch(
        SUPABASE_URL + "/rest/v1/Problems",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY,
            "Authorization":
              "Bearer " + SUPABASE_KEY,
            "Prefer": "return=representation"
          },

          body: JSON.stringify(data)
        }
      );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(error);
      }


      alert(
        "Votre problème a été publié avec succès !"
      );


      e.target.reset();

      afficherProblemes();


    } catch (error) {

      console.error(error);

      alert(
        "Erreur : " + error.message
      );

    }

  });



/* =========================
   AFFICHER LES PROBLÈMES
========================= */

async function afficherProblemes() {

  try {

    const recherche =
      normaliser(
        document.getElementById(
          "search-problems"
        ).value
      );


    const categorieFiltre =
      normaliser(
        document.getElementById(
          "filter-category"
        ).value
      );


    const response = await fetch(

      SUPABASE_URL +
      "/rest/v1/Problems?select=*",

      {
        headers: {

          "apikey": SUPABASE_KEY,

          "Authorization":
            "Bearer " + SUPABASE_KEY

        }
      }
    );


    if (!response.ok) {

      const error =
        await response.text();

      throw new Error(error);

    }


    let problems =
      await response.json();


    const liste =
      document.getElementById(
        "problems-list"
      );


    liste.innerHTML = "";


    /* =========================
       RECHERCHE + FILTRE
    ========================= */

    problems = problems.filter(
      function(problem) {

        const nom =
          normaliser(problem.Name);

        const ville =
          normaliser(problem.City);

        const categorie =
          normaliser(problem.Catégory);

        const texteRecherche =
          nom.includes(recherche) ||
          ville.includes(recherche) ||
          categorie.includes(recherche);

        const filtreCategorie =
          categorieFiltre === "" ||
          categorie === categorieFiltre;


        return (
          texteRecherche &&
          filtreCategorie
        );

      }
    );


    /* =========================
       AFFICHAGE
    ========================= */

    if (problems.length === 0) {

      liste.innerHTML =
        "<p>Aucun problème trouvé.</p>";

      return;

    }


    problems.forEach(
      function(problem) {

          <button
            type="button"
            class="edit-btn"
          >
            const div = document.createElement("div");

div.className = "problem";

div.innerHTML = `
  <h3>${problem.Name || "Sans nom"}</h3>

  <p>
    📍 <strong>Ville :</strong>
    ${problem.City || "Non renseignée"}
  </p>

  <p>
    📂 <strong>Catégorie :</strong>
    ${problem.Catégory || "Non renseignée"}
  </p>

  <div class="problem-description">
    📝 <strong>Problème :</strong><br>
    ${problem.description || "Aucune description"}
  </div>

  <p>
    🚨 <strong>Urgence :</strong>
    ${problem.urgency || "Normal"}
  </p>

  <p>
    📅 <strong>Publié le :</strong>
    ${
      problem.created_at
        ? new Date(problem.created_at).toLocaleString("fr-FR")
        : "Date inconnue"
    }
  </p>

  <hr>

  <button type="button" class="edit-btn">
    Modifier ✏️
  </button>

  <button type="button" class="delete-btn">
    Supprimer 🗑️
  </button>
`;



        /* =========================
           MODIFIER
        ========================= */

        div
          .querySelector(".edit-btn")
          .addEventListener(
            "click",
            async function() {

              const nouveauNom =
                prompt(
                  "Nom :",
                  problem.Name || ""
                );

              if (nouveauNom === null)
                return;


              const nouvelleVille =
                prompt(
                  "Ville :",
                  problem.City || ""
                );

              if (nouvelleVille === null)
                return;


              const nouvelleDescription =
                prompt(
                  "Description :",
                  problem.description || ""
                );

              if (
                nouvelleDescription === null
              )
                return;


              const nouvelleUrgence =
                prompt(
                  "Urgence (Normal, Importance ou Urgente) :",
                  problem.urgency || "Normal"
                );

              if (
                nouvelleUrgence === null
              )
                return;


              const nouvelleCategorie =
                prompt(
                  "Catégorie (Eau, Électricité, Logement, Emploi, Transport, Formation, Réparation ou Autre) :",
                  problem.Catégory || ""
                );

              if (
                nouvelleCategorie === null
              )
                return;


              try {

                const response =
                  await fetch(

                    SUPABASE_URL +
                    "/rest/v1/Problems?id=eq." +
                    problem.id,

                    {

                      method: "PATCH",

                      headers: {

                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          "Bearer " +
                          SUPABASE_KEY,

                        "Content-Type":
                          "application/json",

                        "Prefer":
                          "return=minimal"

                      },

                      body: JSON.stringify({

                        Name:
                          nouveauNom.trim(),

                        City:
                          nouvelleVille.trim(),

                        description:
                          nouvelleDescription.trim(),

                        urgency:
                          nouvelleUrgence.trim(),

                        "Catégory":
                          nouvelleCategorie.trim()

                      })

                    }

                  );


                if (!response.ok) {

                  const error =
                    await response.text();

                  throw new Error(error);

                }


                alert(
                  "Problème modifié avec succès !"
                );


                afficherProblemes();


              } catch (error) {

                console.error(error);

                alert(
                  "Erreur lors de la modification : " +
                  error.message
                );

              }

            }
          );



        /* =========================
           SUPPRIMER
        ========================= */

        div
          .querySelector(".delete-btn")
          .addEventListener(
            "click",
            async function() {

              const supprimer =
                confirm(

                  "Détails du problème :\n\n" +

                  (problem.description || "") +

                  "\n\nVoulez-vous supprimer ce problème ?"

                );


              if (!supprimer)
                return;


              try {

                const response =
                  await fetch(

                    SUPABASE_URL +
                    "/rest/v1/Problems?id=eq." +
                    problem.id,

                    {

                      method: "DELETE",

                      headers: {

                        "apikey":
                          SUPABASE_KEY,

                        "Authorization":
                          "Bearer " +
                          SUPABASE_KEY,

                        "Prefer":
                          "return=minimal"

                      }

                    }

                  );


                if (!response.ok) {

                  const error =
                    await response.text();

                  throw new Error(error);

                }


                alert(
                  "Problème supprimé avec succès !"
                );


                afficherProblemes();


              } catch (error) {

                console.error(error);

                alert(
                  "Erreur lors de la suppression : " +
                  error.message
                );

              }

            }
          );


        liste.appendChild(div);

      }
    );


  } catch (error) {

    console.error(error);

    document.getElementById(
      "problems-list"
    ).innerHTML =
      "<p>Erreur lors du chargement des problèmes.</p>";

  }

}



/* =========================
   RECHERCHE
========================= */

document
  .getElementById("search-btn")
  .addEventListener(
    "click",
    function() {

      afficherProblemes();

    }
  );



/* =========================
   RECHERCHE EN DIRECT
========================= */

document
  .getElementById("search-problems")
  .addEventListener(
    "input",
    function() {

      afficherProblemes();

    }
  );



/* =========================
   EFFACER RECHERCHE
========================= */

document
  .getElementById("clear-search")
  .addEventListener(
    "click",
    function() {

      document.getElementById(
        "search-problems"
      ).value = "";

      document.getElementById(
        "filter-category"
      ).value = "";

      afficherProblemes();

    }
  );



/* =========================
   FILTRE CATÉGORIE
========================= */

document
  .getElementById("filter-category")
  .addEventListener(
    "change",
    function() {

      afficherProblemes();

    }
  );



/* =========================
   BOUTON PUBLIER
========================= */

document
  .getElementById("publier-btn")
  .addEventListener(
    "click",
    function() {

      document
        .getElementById("publier")
        .scrollIntoView({
          behavior: "smooth"
        });

    }
  );



/* =========================
   TROUVER UNE SOLUTION
========================= */

document
  .getElementById("solution-btn")
  .addEventListener(
    "click",
    function() {

      const categorie =
        document.getElementById(
          "catégorie"
        ).value;


      const solutions = {

        "Eau": `
  <strong>Solution pour un problème d'eau :</strong><br><br>

  1️⃣ Vérifiez d'abord si le robinet est bien ouvert.<br><br>

  2️⃣ Vérifiez s'il y a une fuite au niveau des tuyaux ou des robinets.<br><br>

  3️⃣ Si l'eau ne coule pas dans toute la maison, vérifiez l'arrivée d'eau.<br><br>

  4️⃣ Si le problème concerne tout le quartier, renseignez-vous auprès des voisins.<br><br>

  5️⃣ Si le problème continue, contactez le service d'eau de votre zone.
`,
        
        "Électricité": `
  <strong>Solution pour un problème d'électricité :</strong><br><br>

  1️⃣ Vérifiez d'abord le disjoncteur.<br><br>

  2️⃣ Vérifiez si les autres appareils électriques fonctionnent.<br><br>

  3️⃣ Regardez si les voisins ont également une coupure.<br><br>

  4️⃣ Si la coupure concerne uniquement votre logement, vérifiez votre installation électrique.<br><br>

  5️⃣ Si la coupure continue, contactez le service d'électricité de votre zone.
`,
          
        "Logement": `
  <strong>Solution pour un problème de logement :</strong><br><br>

  1️⃣ Identifiez précisément le problème dans le logement.<br><br>

  2️⃣ Prenez des photos si nécessaire pour garder une preuve.<br><br>

  3️⃣ Informez le propriétaire ou le responsable du logement.<br><br>

  4️⃣ Expliquez clairement les réparations nécessaires.<br><br>

  5️⃣ Si le problème n'est pas réglé, renseignez-vous auprès du service ou de l'autorité compétente de votre zone.
`,
          
        "Emploi": `
  <strong>Solution pour un problème d'emploi :</strong><br><br>

  1️⃣ Identifiez le type d'emploi que vous recherchez.<br><br>

  2️⃣ Préparez ou mettez à jour votre CV.<br><br>

  3️⃣ Consultez les offres d'emploi disponibles dans votre ville.<br><br>

  4️⃣ Contactez les services d'accompagnement à l'emploi ou les centres de formation.<br><br>

  5️⃣ Postulez aux offres qui correspondent à votre profil.
`,
          
        "Transport": `
  <strong>Solution pour un problème de transport :</strong><br><br>

  1️⃣ Identifiez précisément le problème de transport.<br><br>

  2️⃣ Vérifiez les moyens de transport disponibles dans votre zone.<br><br>

  3️⃣ Consultez les horaires et les itinéraires disponibles.<br><br>

  4️⃣ En cas de panne ou de problème avec un véhicule, contactez un réparateur.<br><br>

  5️⃣ Si le problème concerne un service de transport, contactez le responsable du service.
`,
          
        "Formation": `
  <strong>Solution pour un problème de formation :</strong><br><br>

  1️⃣ Identifiez le domaine dans lequel vous souhaitez vous former.<br><br>

  2️⃣ Recherchez les formations disponibles dans votre ville ou en ligne.<br><br>

  3️⃣ Comparez la durée, le coût et les conditions d'inscription.<br><br>

  4️⃣ Vérifiez si la formation délivre une attestation ou un diplôme.<br><br>

  5️⃣ Choisissez la formation qui correspond le mieux à votre objectif.
`,
        
        "Réparation": `
  <strong>Solution pour un problème de réparation :</strong><br><br>

  1️⃣ Identifiez précisément ce qui est en panne.<br><br>

  2️⃣ Vérifiez si le problème peut être résolu simplement et en toute sécurité.<br><br>

  3️⃣ Recherchez un réparateur qualifié dans votre ville.<br><br>

  4️⃣ Expliquez clairement la panne au réparateur.<br><br>

  5️⃣ Demandez une estimation du coût avant de commencer la réparation.
`,
          
        "Autre": `
  <strong>Solution pour un autre problème :</strong><br><br>

  1️⃣ Décrivez clairement le problème rencontré.<br><br>

  2️⃣ Indiquez votre ville ou votre zone.<br><br>

  3️⃣ Précisez depuis quand le problème existe.<br><br>

  4️⃣ Ajoutez une photo ou des informations utiles si nécessaire.<br><br>

  5️⃣ Recherchez une personne ou un service compétent pour vous aider.
`,
          
      };


      if (categorie === "") {

        alert(
          "Choisissez d'abord une catégorie."
        );

        return;

      }


      let zoneSolution =
        document.getElementById(
          "solution"
        );


      if (!zoneSolution) {

        zoneSolution =
          document.createElement("div");

        zoneSolution.id =
          "solution";

        document
          .getElementById("solution-btn")
          .after(zoneSolution);

      }


      zoneSolution.innerHTML =
        "<strong>Solution proposée :</strong><br>" +
        solutions[categorie];

    }
  );



/* =========================
   CHARGEMENT INITIAL
========================= */

afficherProblemes();

</script>

</body>
</html>
