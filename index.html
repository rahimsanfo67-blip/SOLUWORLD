const SUPABASE_KEY =

/* =====================================================
   FONCTION NORMALISER
===================================================== */

function normaliser(texte) {

  if (
    texte === null ||
    texte === undefined
  ) {

    return "";

  }

  return String(texte)
    .toLowerCase()
    .normalize("NFD")
    .replace(
      /[\u0300-\u036f]/g,
      ""
    )
    .trim();

}


/* =====================================================
   ÉCHAPPER LE HTML
===================================================== */

function echapperHTML(texte) {

  if (
    texte === null ||
    texte === undefined
  ) {

    return "";

  }

  return String(texte)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   AFFICHER MESSAGE
===================================================== */

function afficherMessage(
  id,
  texte,
  type
) {

  const element =
    document.getElementById(id);

  if (!element) {
    return;
  }

  element.textContent =
    texte;

  element.className =
    "message " + type;

  element.style.display =
    "block";

}


/* =====================================================
   CACHER MESSAGE
===================================================== */

function cacherMessage(id) {

  const element =
    document.getElementById(id);

  if (!element) {
    return;
  }

  element.style.display =
    "none";

}

            .value
            .trim(),

        urgency:
          document
            .getElementById("urgence")
            .value

      };


      try {

        const response =
          await fetch(
            SUPABASE_URL +
            "/rest/v1/Problems",
            {

              method: "POST",

              headers: {

                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_KEY,

                "Prefer":
                  "return=representation"

              },

              body:
                JSON.stringify(data)

            }
          );


        if (!response.ok) {

          const erreur =
            await response.text();

          throw new Error(
            erreur
