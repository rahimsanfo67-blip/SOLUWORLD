  <body>
    <section id="publier">
      <h2>publier un problème</h2>

      <form onsubmit="event.preventDefault(); alert(votre problème à été publié avec succès !');">
        <label for="nom">votre nom</label>

    <h1>SOLUWORLD 🌍</h1>

    <p>un problème. une solution. partout.</p>

    <button>publier un problème</button>
    <button id="solution-btn" type="button">trouver une solution</button>
  
    </body>
      <section>
  <h2>Problèmes publiés</h2>
        <input
  type="text"
  id="search-problems"
  placeholder="🔎 Rechercher un problème, une ville ou une catégorie..."
>
  <div id="problems-list"></div>
      </section>
<script>
const SUPABASE_URL = "https://cempljialofhnkvjpsko.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYTq252UBISGbU9qIFWSrA_YR5Jh-4f";

document.querySelector("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    created_at: new Date().toISOString(),
    Name: document.getElementById("nom").value,
    City: document.getElementById("ville").value,
    "Catégory": document.getElementById("catégorie").value,
    description: document.getElementById("problème").value,
    urgency: document.getElementById("urgence").value
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/Problems",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=representation"
        },
        body: JSON.stringify(data)
      }
    );
    const result = await response.text();
console.log("Résultat suppression :", result);

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error);
    }

    alert("Votre problème a été publié avec succès !");
    e.target.reset();

  } catch (error) {
    console.error(error);
 alert("Erreur : " + error.message);
  }
}); 
  async function afficherProblemes() {
    const recherche = document.getElementById("search-problems").value.toLowerCase();
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/Problems?select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  let problems = await response.json();
  const liste = document.getElementById("problems-list");

  liste.innerHTML = "";
    problems = problems.filter(problem =>
  problem.Name.toLowerCase().includes(recherche) ||
  problem.City.toLowerCase().includes(recherche) ||
  problem.Catégory.toLowerCase().includes(recherche)
);

  problems.forEach(problem => {
    const div = document.createElement("div");

    div.style.border = "1px solid #ccc";
    div.style.padding = "15px";
    div.style.marginBottom = "10px";
    div.style.borderRadius = "8px";

    div.innerHTML = `
        <h3>${problem.Name}</h3>
        <p>Ville : ${problem.City}</p>
        <p>Catégorie : ${problem.Catégory}</p>
        <p>${problem.description}</p>
        <p>Urgence : ${problem.urgency}</p>
        <p>Publié le : ${new Date(problem.created_at).toLocaleString("fr-FR")}</p>
        <hr>
        <button type="button" class="edit-btn">Modifier ✏️</button>
        <button type="button" class="delete-btn">Supprimer</button>
    `;
    div.querySelector(".edit-btn").addEventListener("click", async function(e) {
    e.stopPropagation();

    const nouveauNom = prompt("Nom :", problem.Name);
    if (nouveauNom === null) return;

    const nouvelleVille = prompt("Ville :", problem.City);
    if (nouvelleVille === null) return;

    const nouvelleDescription = prompt(
        "Description :",
        problem.description
    );
    if (nouvelleDescription === null) return;
      
      const nouvelleUrgence = prompt(
    "Urgence (Normal, Importance ou Urgente) :",
    problem.urgency
);

if (nouvelleUrgence === null) return;
      const nouvelleCategorie = prompt(
    "Catégorie :",
    problem.Catégory
);

if (nouvelleCategorie === null) return;
      

    try {
        const response = await fetch(
            SUPABASE_URL + "/rest/v1/Problems?id=eq." + problem.id,
            {
                method: "PATCH",
                headers: {
                    "apikey": SUPABASE_KEY,
                    "Authorization": "Bearer " + SUPABASE_KEY,
                    "Content-Type": "application/json",
                    "Prefer": "return=minimal"
                },
                body: JSON.stringify({
                    Name: nouveauNom,
                    City: nouvelleVille,
                    description: nouvelleDescription,
                  urgency: nouvelleUrgence,
                  "Catégory": nouvelleCategorie
                  
                })
              
            }
        );

        if (!response.ok) {
            const error = await response.text();
            throw new Error(error);
        }

        alert("Problème modifié avec succès !");
        afficherProblemes();

    } catch (error) {
        console.error(error);
        alert("Erreur lors de la modification : " + error.message);
    }
});
    div.querySelector(".delete-btn").addEventListener("click", async function(e) {
    

        const supprimer = confirm(
            "Détails du problème :\n\n" +
            problem.description +
            "\n\nVoulez-vous supprimer ce problème ?"
        );

        if (!supprimer) {
            return;
        }
      console.log("ID du problème :", problem.id);

        try {
            const response = await fetch(
                SUPABASE_URL + "/rest/v1/Problems?id=eq." + problem.id,
                {
                    method: "DELETE",
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": "Bearer " + SUPABASE_KEY,
                        "Prefer": "return=minimal"
                    }
                }
            );

            if (!response.ok) {
                const error = await response.text();
                throw new Error(error);
            }

            alert("Problème supprimé avec succès !");
            afficherProblemes();

        } catch (error) {
            console.error(error);
            alert("Erreur lors de la suppression : " + error.message);
        }
    });

    liste.appendChild(div);
});
    
}

  document.getElementById("solution-btn").addEventListener("click", function() {
    const categorie = document.getElementById("catégorie").value;

    const solutions = {
        "Eau": "Vérifiez les canalisations et contactez le service d'eau de votre zone.",
        "Électricité": "Vérifiez le disjoncteur. Si la coupure continue, contactez le service d'électricité.",
        "Logement": "Contactez le propriétaire ou le responsable du logement.",
        "Emploi": "Consultez les offres d'emploi disponibles et les services d'accompagnement.",
        "Transport": "Vérifiez les transports disponibles dans votre zone.",
        "Formation": "Recherchez une formation adaptée à votre besoin.",
        "Réparation": "Contactez un réparateur proche de votre ville.",
        "Autre": "Décrivez votre problème pour obtenir une solution adaptée."
    };

    if (categorie === "" || categorie === "choisir une categorie") {
        alert("Choisissez d'abord une catégorie.");
        return;
    }

    let zoneSolution = document.getElementById("solution");

if (!zoneSolution) {
    zoneSolution = document.createElement("div");
    zoneSolution.id = "solution";
    zoneSolution.style.padding = "15px";
    zoneSolution.style.marginTop = "15px";
    zoneSolution.style.border = "2px solid #1464f4";
    zoneSolution.style.borderRadius = "8px";
    zoneSolution.style.background = "#eaf2ff";
    
    document.getElementById("solution-btn").after(zoneSolution);
}

zoneSolution.innerHTML = "<strong>Solution proposée :</strong><br>" + solutions[categorie];
});
  afficherProblemes();
</script>

    </body>
