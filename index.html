    <section id="publier">
      <h2>publier un problème</h2>

      <form onsubmit="event.preventDefault(); alert(votre problème à été publié avec succès !');">
        <label for="nom">votre nom</label>
        <input type="text" id="nom" placeholder=votre nom"required>

        <label for="ville">ville</label>
        <input type="text" id="ville" placeholder="Ex". Ouagadougou "required>
        <label for="catégorie">catégorie</label>
        <select id="catégorie" required>
          <option value="">choisir une categorie</option>
          <option>Eau</option>

        </select>

        <label for="problème">Décrivez votre problème</label>
        <textarea id="problème" rows="5" placeholder="Expliquer votre problème..." required></textarea>

        <label for="urgence">urgence</label>
        <select id="urgence">
          <option>Normal</option>

          <option>Urgente</option>
        </select>

        <button type="submit">publier mon problème</button>

    <h1>SOLUWORLD 🌍</h1>

    <p>un problème. une solution. partout.</p>

    <button>publier un problème</button>
    <button><trouver une solution</button>
      
      <section>
  <h2>Problèmes publiés</h2>
  <div id="problems-list"></div>
      </section>
      
    </body>
<script>
const SUPABASE_URL = "https://cempljialofhnkvjpsko.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYTq252UBISGbU9qIFWSrA_YR5Jh-4f";

document.querySelector("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    created_at: new Date().toISOString(),
    Name: document.getElementById("nom").value,
    City: document.getElementById("ville").value,
    "Catégory": document.getElementById("catégorie").value,
    description: document.getElementById("problème").value,
    urgency: document.getElementById("urgence").value
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/Problems",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=representation"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error);
    }

    alert("Votre problème a été publié avec succès !");
    e.target.reset();

  } catch (error) {
    console.error(error);
 alert("Erreur : " + error.message);
  }
}); 
  async function afficherProblemes() {
  const response = await fetch(
    SUPABASE_URL + "/rest/v1/Problems?select=*",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  const problems = await response.json();
  const liste = document.getElementById("problems-list");

  liste.innerHTML = "";

  problems.forEach(problem => {
    const div = document.createElement("div");
    div.innerHTML = `
      <h3>${problem.Name}</h3>
      <p>Ville : ${problem.City}</p>
      <p>Catégorie : ${problem.Catégory}</p>
      <p>${problem.description}</p>
      <p>Urgence : ${problem.urgency}</p>
      <hr>
    `;
    liste.appendChild(div);
  });
}

afficherProblemes();
</script>
