        <label for="nom">votre nom</label>

        <label for="catégorie">catégorie</label>

    <p>un problème. une solution. partout.</p>

<script>
const SUPABASE_URL = "https://xxxxxxxx.supabase.co";
const SUPABASE_KEY = "sb_publishable_TYTq252UBISGbU9qIFWSrA_YR5Jh-4f";

document.querySelector("form").addEventListener("submit", async function(e) {
  e.preventDefault();

  const data = {
    Name: document.getElementById("nom").value,
    City: document.getElementById("ville").value,
    "Catégory": document.getElementById("catégorie").value,
    description: document.getElementById("problème").value,
    urgency: document.getElementById("urgence").value
  };

  try {
    const response = await fetch(
      SUPABASE_URL + "/rest/v1/Problems",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY,
          "Prefer": "return=representation"
        },
        body: JSON.stringify(data)
      }
    );

    if (!response.ok) {
      const error = await response.text();
      throw new Error(error);
    }

    alert("Votre problème a été publié avec succès !");
    this.reset();

  } catch (error) {
    console.error(error);
    alert("Erreur lors de la publication du problème.");
  }
}); 
</script>
